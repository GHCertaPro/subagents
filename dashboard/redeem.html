<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Subagents Dashboard — Create Account</title>
<link rel="stylesheet" href="style.css" />
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png" />
<link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16.png" />
<style>
  .auth-container {
    max-width: 380px;
    margin: 80px auto;
    padding: 32px;
    background: #1a1a2e;
    border: 1px solid #2a2a4a;
    border-radius: 12px;
  }
  .auth-container h2 {
    margin: 0 0 24px;
    font-size: 1.4rem;
    text-align: center;
    color: #e0e0f0;
  }
  .auth-field {
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin-bottom: 16px;
  }
  .auth-field label {
    font-size: 0.85rem;
    color: #9090b0;
  }
  .auth-field input {
    padding: 10px 12px;
    background: #0f0f1e;
    border: 1px solid #3a3a5a;
    border-radius: 6px;
    color: #e0e0f0;
    font-size: 0.95rem;
    outline: none;
  }
  .auth-field input:focus {
    border-color: #4af;
  }
  .auth-btn {
    width: 100%;
    padding: 11px;
    background: #4af;
    color: #000;
    border: none;
    border-radius: 6px;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    margin-top: 8px;
  }
  .auth-btn:hover { background: #3ae; }
  .auth-btn:disabled { opacity: 0.5; cursor: default; }
  .auth-error {
    color: #f66;
    font-size: 0.85rem;
    margin-top: 12px;
    min-height: 1.2em;
    text-align: center;
  }
  .auth-links {
    margin-top: 20px;
    text-align: center;
    font-size: 0.85rem;
    color: #6060a0;
  }
  .auth-links a { color: #4af; text-decoration: none; }
  .auth-links a:hover { text-decoration: underline; }
  .auth-hint {
    font-size: 0.8rem;
    color: #6060a0;
    margin-top: 2px;
  }
</style>
</head>
<body>
<header>
  <h1><img class="logo-icon" src="assets/submarine-logo.png" alt="" aria-hidden="true"> Subagents Dashboard</h1>
</header>

<div class="auth-container">
  <h2>Create Account</h2>
  <form id="redeem-form" autocomplete="on">
    <div class="auth-field">
      <label for="code">Invite Code</label>
      <input type="text" id="code" name="code" required autocomplete="off" placeholder="16-character invite code" />
    </div>
    <div class="auth-field">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" required autocomplete="email" placeholder="you@example.com" />
    </div>
    <div class="auth-field">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" required autocomplete="new-password" placeholder="••••••••" />
      <span class="auth-hint">Minimum 8 characters</span>
    </div>
    <button type="submit" class="auth-btn" id="submit-btn">Create Account</button>
    <div class="auth-error" id="error-msg"></div>
  </form>
  <div class="auth-links">
    Already have an account? <a href="/login">Sign in →</a>
  </div>
</div>

<script src="config.js"></script>
<script>
(function () {
  const form = document.getElementById("redeem-form");
  const errorMsg = document.getElementById("error-msg");
  const submitBtn = document.getElementById("submit-btn");

  // Pre-fill invite code from URL param ?code=
  const urlCode = new URLSearchParams(window.location.search).get("code");
  if (urlCode) {
    document.getElementById("code").value = urlCode;
  }

  // If already authenticated, go straight to dashboard
  const stored = localStorage.getItem("__auth_token");
  if (stored) {
    window.location.replace("/");
    return;
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    errorMsg.textContent = "";
    submitBtn.disabled = true;
    submitBtn.textContent = "Creating account…";

    const code = document.getElementById("code").value.trim();
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    if (password.length < 8) {
      errorMsg.textContent = "Password must be at least 8 characters.";
      submitBtn.disabled = false;
      submitBtn.textContent = "Create Account";
      return;
    }

    try {
      const res = await fetch((window.SUBAGENTS_API_BASE || "") + "/api/auth/invite/redeem", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ code, email, password }),
      });
      const data = await res.json();
      if (!res.ok) {
        errorMsg.textContent = data.error || "Failed to create account.";
        return;
      }
      localStorage.setItem("__auth_token", data.token);
      localStorage.setItem("__auth_user", JSON.stringify(data.user));
      window.location.replace("/");
    } catch (err) {
      errorMsg.textContent = "Network error. Please try again.";
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = "Create Account";
    }
  });
})();
</script>
</body>
</html>
