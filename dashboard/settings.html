<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Subagents Dashboard — Settings</title>
<link rel="stylesheet" href="style.css" />
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png" />
<link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16.png" />
</head>
<body>
<header>
  <h1><img class="logo-icon" src="assets/submarine-logo.png" alt="" aria-hidden="true"> Subagents Dashboard</h1>
  <nav class="top-nav" aria-label="Dashboard views">
    <a href="/" class="nav-link">Live</a>
    <a href="/history" class="nav-link">History</a>
    <a href="/settings" class="nav-link nav-link--icon active" aria-current="page" aria-label="Settings" title="Settings">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" width="18" height="18" aria-hidden="true">
        <path fill-rule="evenodd" d="M11.49 3.17c-.38-1.56-2.6-1.56-2.98 0a1.532 1.532 0 01-2.286.948c-1.372-.836-2.942.734-2.106 2.106.54.886.061 2.042-.947 2.287-1.561.379-1.561 2.6 0 2.978a1.532 1.532 0 01.947 2.287c-.836 1.372.734 2.942 2.106 2.106a1.532 1.532 0 012.287.947c.379 1.561 2.6 1.561 2.978 0a1.533 1.533 0 012.287-.947c1.372.836 2.942-.734 2.106-2.106a1.533 1.533 0 01.947-2.287c1.561-.379 1.561-2.6 0-2.978a1.532 1.532 0 01-.947-2.287c.836-1.372-.734-2.942-2.106-2.106a1.532 1.532 0 01-2.287-.947zM10 13a3 3 0 100-6 3 3 0 000 6z" clip-rule="evenodd" />
      </svg>
    </a>
  </nav>
  <div class="meta">
    <span>&nbsp;</span>
  </div>
</header>

<div class="error-banner" id="error-banner"></div>

<div id="settings-view">
  <section>
    <h2>Account</h2>
    <ul id="settings-list">
      <li id="settings-email-row">
        <span class="task-name">Email</span>
        <span id="settings-email" class="history-times">—</span>
      </li>
      <li id="settings-role-row">
        <span class="task-name">Role</span>
        <span id="settings-role" class="history-times">—</span>
      </li>
    </ul>
  </section>

  <section>
    <h2>Session</h2>
    <button type="button" id="logout-btn" class="load-more-btn" style="margin:0;">Sign Out</button>
  </section>

  <section id="work-sessions-section">
    <h2>Work Sessions</h2>
    <div id="ws-today-section" style="margin-bottom:1.5rem;">
      <div style="display:flex;align-items:baseline;gap:1rem;margin-bottom:0.6rem;">
        <h3 style="margin:0;font-size:1rem;font-weight:600;color:#ccc;letter-spacing:.02em;">Today</h3>
        <span style="font-size:0.875rem;color:#aaa;">Total: <strong id="ws-today-total" style="color:#e8e8e8;">—</strong></span>
      </div>
      <div class="work-sessions-table-wrap">
        <table class="work-sessions-table">
          <thead>
            <tr>
              <th>Date</th>
              <th>Clock In</th>
              <th>Clock Out</th>
              <th>Duration</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="ws-today-tbody">
            <tr><td colspan="5" style="color:#555; font-style:italic; padding:12px;">Loading&hellip;</td></tr>
          </tbody>
        </table>
      </div>
    </div>

    <div class="work-sessions-stats">
      <div class="work-stat-box">
        <div class="work-stat-label">This Week</div>
        <div class="work-stat-value" id="ws-hours-week">—</div>
      </div>
      <div class="work-stat-box">
        <div class="work-stat-label">This Month</div>
        <div class="work-stat-value" id="ws-hours-month">—</div>
      </div>
    </div>
    <div class="ws-sessions-header">
      <button type="button" id="ws-add-entry-btn" class="ws-add-btn">+ Add Entry</button>
    </div>
    <div id="ws-add-form" class="ws-add-form-wrap" style="display:none;">
      <label class="ws-add-label">Clock In
        <input type="datetime-local" id="ws-add-clock-in" class="ws-dt-input">
      </label>
      <label class="ws-add-label">Clock Out
        <input type="datetime-local" id="ws-add-clock-out" class="ws-dt-input">
      </label>
      <div class="ws-add-actions">
        <button type="button" id="ws-add-submit" class="ws-act-btn ws-act-btn--save">Add</button>
        <button type="button" id="ws-add-cancel" class="ws-act-btn">Cancel</button>
      </div>
      <span class="ws-add-err"></span>
    </div>
    <div class="work-sessions-table-wrap">
      <table class="work-sessions-table">
        <thead>
          <tr>
            <th>Date</th>
            <th>Clock In</th>
            <th>Clock Out</th>
            <th>Duration</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="ws-table-body">
          <tr><td colspan="5" style="color:#555; font-style:italic; padding:12px;">Loading&hellip;</td></tr>
        </tbody>
      </table>
    </div>
    <button type="button" id="ws-load-more" class="load-more-btn" style="display:none;">Load More</button>
  </section>
</div>

<footer>Subagents Dashboard</footer>
<script src="config.js"></script>
<script src="settings.js"></script>
</body>
</html>
