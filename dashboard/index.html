<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Subagents Dashboard — Live</title>
<link rel="stylesheet" href="style.css" />
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png" />
<link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16.png" />
</head>
<body>
<!--
  This is the standalone "Live" page (the app's homepage / default route,
  served at "/"). It only ever shows currently running + queued subagents.
  History (completed/failed runs) now lives on its own separate page,
  dashboard/history.html, served at "/history" -- see nav below and
  server/index.js for the routing. There is no client-side view-toggle
  state anymore; these are two real pages/routes. The nav lives inside
  <header>, alongside the <h1>, so title + nav render on the same row
  (see dashboard/style.css header flex layout).
-->
<header>
  <h1><img class="logo-icon" src="assets/submarine-logo.png" alt="" aria-hidden="true"> Subagents Dashboard</h1>
  <nav class="top-nav" aria-label="Dashboard views">
    <a href="/" class="nav-link active" aria-current="page">Live</a>
    <a href="/history" class="nav-link">History</a>
  </nav>
  <div class="meta">
    <span id="last-updated">not yet updated</span>
    <select id="bot-selector" aria-label="Filter by bot" title="Filter by bot"
      onchange="(function(sel){var q=new URLSearchParams(window.location.search);if(sel.value&&sel.value!=='all'){q.set('bot',sel.value);}else{q.delete('bot');}window.location.search=q.toString();})(this)">
      <option value="all">All bots</option>
      <option value="cos">CoS</option>
      <option value="dispatch">Dispatch</option>
    </select>
  </div>
</header>

<div class="error-banner" id="error-banner"></div>

<div id="live-view">
  <section>
    <h2>Currently Running</h2>
    <div id="running-grid"><!-- exactly 3 slots, rendered by app.js --></div>
  </section>

  <section>
    <h2>Queued</h2>
    <ul id="queued-list"><!-- variable length, rendered by app.js --></ul>
  </section>
</div>

<script src="config.js"></script>
<script src="app.js"></script>
<script>
  // Pre-select bot dropdown to match current ?bot= URL param
  (function() {
    var bot = new URLSearchParams(window.location.search).get('bot');
    var sel = document.getElementById('bot-selector');
    if (sel && bot) sel.value = bot;
  })();
</script>
</body>
</html>
