<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Subagents Dashboard</title>
<link rel="stylesheet" href="style.css" />
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png" />
<link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16.png" />
</head>
<body>
<header>
  <h1><img class="logo-icon" src="assets/submarine-logo.png" alt="" aria-hidden="true"> Subagents Dashboard</h1>
  <div class="meta">
    <span id="last-updated">not yet updated</span>
  </div>
  <div class="view-toggle" id="view-toggle" role="tablist">
    <button type="button" class="toggle-btn active" id="view-btn-live" data-view="live" role="tab" aria-selected="true">Live</button>
    <button type="button" class="toggle-btn" id="view-btn-history" data-view="history" role="tab" aria-selected="false">History</button>
  </div>
</header>

<div class="error-banner" id="error-banner"></div>

<div id="live-view">
  <section>
    <h2>Currently Running</h2>
    <div id="running-grid"><!-- exactly 3 slots, rendered by app.js --></div>
  </section>

  <section>
    <h2>Queued</h2>
    <ul id="queued-list"><!-- variable length, rendered by app.js --></ul>
  </section>
</div>

<div id="history-view" hidden>
  <section>
    <h2>History</h2>
    <ul id="history-list"><!-- 50 most recent terminal-status runs, then +25 per Load More click, rendered by app.js --></ul>
    <button type="button" id="history-load-more" class="load-more-btn" hidden>Load More</button>
  </section>
</div>

<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
