<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Subagents Dashboard</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<header>
  <h1><svg class="logo-icon" viewBox="0 0 64 32" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false"><rect x="4" y="14" width="48" height="12" rx="6" fill="none" stroke="currentColor" stroke-width="2"></rect><rect x="24" y="6" width="8" height="8" rx="1.5" fill="none" stroke="currentColor" stroke-width="2"></rect><line x1="28" y1="6" x2="28" y2="2" stroke="currentColor" stroke-width="2" stroke-linecap="round"></line><circle cx="16" cy="20" r="1.6" fill="currentColor"></circle><line x1="52" y1="17" x2="58" y2="13" stroke="currentColor" stroke-width="2" stroke-linecap="round"></line><line x1="52" y1="23" x2="58" y2="27" stroke="currentColor" stroke-width="2" stroke-linecap="round"></line></svg> Subagents Dashboard</h1>
  <div class="meta">
    <span id="last-updated">not yet updated</span>
  </div>
  <div class="view-toggle" id="view-toggle" role="tablist">
    <button type="button" class="toggle-btn active" id="view-btn-live" data-view="live" role="tab" aria-selected="true">Live</button>
    <button type="button" class="toggle-btn" id="view-btn-history" data-view="history" role="tab" aria-selected="false">History</button>
  </div>
</header>

<div class="error-banner" id="error-banner"></div>

<div id="live-view">
  <section>
    <h2>Currently Running</h2>
    <div id="running-grid"><!-- exactly 3 slots, rendered by app.js --></div>
  </section>

  <section>
    <h2>Queued</h2>
    <ul id="queued-list"><!-- variable length, rendered by app.js --></ul>
  </section>
</div>

<div id="history-view" hidden>
  <section>
    <h2>History</h2>
    <ul id="history-list"><!-- variable length, terminal-status runs, rendered by app.js --></ul>
  </section>
</div>

<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
