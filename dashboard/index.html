<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Subagents Dashboard — Live</title>
<link rel="stylesheet" href="style.css" />
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png" />
<link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16.png" />
</head>
<body>
<header>
  <h1><img class="logo-icon" src="assets/submarine-logo.png" alt="" aria-hidden="true"> Subagents Dashboard</h1>
  <div class="meta">
    <span id="last-updated">not yet updated</span>
  </div>
</header>

<!--
  This is the standalone "Live" page (the app's homepage / default route,
  served at "/"). It only ever shows currently running + queued subagents.
  History (completed/failed runs) now lives on its own separate page,
  dashboard/history.html, served at "/history" -- see nav below and
  server/index.js for the routing. There is no client-side view-toggle
  state anymore; these are two real pages/routes.
-->
<nav class="top-nav" aria-label="Dashboard views">
  <a href="/" class="nav-link active" aria-current="page">Live</a>
  <a href="/history" class="nav-link">History</a>
</nav>

<div class="error-banner" id="error-banner"></div>

<div id="live-view">
  <section>
    <h2>Currently Running</h2>
    <div id="running-grid"><!-- exactly 3 slots, rendered by app.js --></div>
  </section>

  <section>
    <h2>Queued</h2>
    <ul id="queued-list"><!-- variable length, rendered by app.js --></ul>
  </section>
</div>

<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
