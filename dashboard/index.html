<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Subagents Dashboard — Live</title>
<link rel="stylesheet" href="style.css" />
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png" />
<link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16.png" />
</head>
<body>
<header>
  <h1><img class="logo-icon" src="assets/submarine-logo.png" alt="" aria-hidden="true"> Subagents Dashboard</h1>
  <nav class="top-nav" aria-label="Dashboard views">
    <a href="/" class="nav-link active" aria-current="page">Live</a>
    <a href="/history" class="nav-link">History</a>
    <a href="/settings" class="nav-link">Settings</a>
  </nav>
  <div class="meta">
    <span id="last-updated">not yet updated</span>
  </div>
</header>

<div class="error-banner" id="error-banner"></div>

<!-- Token gate: shown when no token is present in URL/sessionStorage -->
<div id="token-gate" style="display:none; text-align:center; padding:60px 20px;">
  <p style="color:#aaa; margin-bottom:16px;">No access token found.</p>
  <a href="/invite.html" style="color:#4af; text-decoration:underline;">Enter your invite code</a>
</div>

<div id="live-view">
  <section>
    <h2>Currently Running</h2>
    <div id="running-grid"><!-- exactly 3 slots, rendered by app.js --></div>
  </section>

  <section>
    <h2>Queued</h2>
    <ul id="queued-list"><!-- variable length, rendered by app.js --></ul>
  </section>
</div>

<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
