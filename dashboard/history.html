<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Subagents Dashboard — History</title>
<link rel="stylesheet" href="style.css" />
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png" />
<link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16.png" />
</head>
<body>
<!--
  Standalone "History" page, served at "/history" (see server/index.js).
  Shows only completed ("done") and failed (and cancelled) past runs --
  never the currently running/queued set, which now lives solely on the
  Live homepage (dashboard/index.html, served at "/"). The nav lives
  inside <header>, alongside the <h1>, so title + nav render on the same
  row (see dashboard/style.css header flex layout).
-->
<header>
  <h1><img class="logo-icon" src="assets/submarine-logo.png" alt="" aria-hidden="true"> Subagents Dashboard</h1>
  <nav class="top-nav" aria-label="Dashboard views">
    <a href="/" class="nav-link">Live</a>
    <a href="/history" class="nav-link active" aria-current="page">History</a>
  </nav>
  <div class="meta">
    <span id="last-updated">&nbsp;</span>
    <select id="bot-selector" aria-label="Filter by bot" title="Filter by bot"
      onchange="(function(sel){var q=new URLSearchParams(window.location.search);if(sel.value&&sel.value!=='all'){q.set('bot',sel.value);}else{q.delete('bot');}window.location.search=q.toString();})(this)">
      <option value="all">All bots</option>
      <option value="cos">CoS</option>
      <option value="dispatch">Dispatch</option>
    </select>
  </div>
</header>

<div class="error-banner" id="error-banner"></div>

<div id="history-view">
  <section>
    <h2>History</h2>
    <ul id="history-list"><!-- 50 most recent terminal-status runs, then +25 per Load More click, rendered by app.js --></ul>
    <button type="button" id="history-load-more" class="load-more-btn" hidden>Load More</button>
  </section>
</div>

<script src="config.js"></script>
<script src="app.js"></script>
<script>
  // Pre-select bot dropdown to match current ?bot= URL param
  (function() {
    var bot = new URLSearchParams(window.location.search).get('bot');
    var sel = document.getElementById('bot-selector');
    if (sel && bot) sel.value = bot;
  })();
</script>
</body>
</html>
