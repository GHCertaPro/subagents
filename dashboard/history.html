<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Subagents Dashboard — History</title>
<link rel="stylesheet" href="style.css" />
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png" />
<link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16.png" />
</head>
<body>
<header>
  <h1><img class="logo-icon" src="assets/submarine-logo.png" alt="" aria-hidden="true"> Subagents Dashboard</h1>
  <nav class="top-nav" aria-label="Dashboard views">
    <a href="/" class="nav-link">Live</a>
    <a href="/history" class="nav-link active" aria-current="page">History</a>
    <a href="/settings" class="nav-link">Settings</a>
  </nav>
  <div class="meta">
    <span id="last-updated">&nbsp;</span>
  </div>
</header>

<div class="error-banner" id="error-banner"></div>

<!-- Token gate: shown when no token is present in URL/sessionStorage -->
<div id="token-gate" style="display:none; text-align:center; padding:60px 20px;">
  <p style="color:#aaa; margin-bottom:16px;">No access token found.</p>
  <a href="/invite.html" style="color:#4af; text-decoration:underline;">Enter your invite code</a>
</div>

<div id="history-view">
  <section>
    <h2>History</h2>
    <ul id="history-list"><!-- 50 most recent terminal-status runs, then +25 per Load More click, rendered by app.js --></ul>
    <button type="button" id="history-load-more" class="load-more-btn" hidden>Load More</button>
  </section>
</div>

<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
