<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Subagents Dashboard — Sign In</title>
<link rel="stylesheet" href="style.css" />
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png" />
<link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16.png" />
<style>
  .auth-container {
    max-width: 380px;
    margin: 80px auto;
    padding: 32px;
    background: #1a1a2e;
    border: 1px solid #2a2a4a;
    border-radius: 12px;
  }
  .auth-container h2 {
    margin: 0 0 24px;
    font-size: 1.4rem;
    text-align: center;
    color: #e0e0f0;
  }
  .auth-field {
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin-bottom: 16px;
  }
  .auth-field label {
    font-size: 0.85rem;
    color: #9090b0;
  }
  .auth-field input {
    padding: 10px 12px;
    background: #0f0f1e;
    border: 1px solid #3a3a5a;
    border-radius: 6px;
    color: #e0e0f0;
    font-size: 0.95rem;
    outline: none;
  }
  .auth-field input:focus {
    border-color: #4af;
  }
  .auth-btn {
    width: 100%;
    padding: 11px;
    background: #4af;
    color: #000;
    border: none;
    border-radius: 6px;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    margin-top: 8px;
  }
  .auth-btn:hover { background: #3ae; }
  .auth-btn:disabled { opacity: 0.5; cursor: default; }
  .auth-error {
    color: #f66;
    font-size: 0.85rem;
    margin-top: 12px;
    min-height: 1.2em;
    text-align: center;
  }
  .auth-links {
    margin-top: 20px;
    text-align: center;
    font-size: 0.85rem;
    color: #6060a0;
  }
  .auth-links a { color: #4af; text-decoration: none; }
  .auth-links a:hover { text-decoration: underline; }
</style>
</head>
<body>
<header>
  <h1><img class="logo-icon" src="assets/submarine-logo.png" alt="" aria-hidden="true"> Subagents Dashboard</h1>
</header>

<div class="auth-container">
  <h2>Sign In</h2>
  <form id="login-form" autocomplete="on">
    <div class="auth-field">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" required autocomplete="email" placeholder="you@example.com" />
    </div>
    <div class="auth-field">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" required autocomplete="current-password" placeholder="••••••••" />
    </div>
    <button type="submit" class="auth-btn" id="submit-btn">Sign In</button>
    <div class="auth-error" id="error-msg"></div>
  </form>
  <div class="auth-links">
    Have an invite code? <a href="/redeem">Create your account →</a>
  </div>
</div>

<script src="config.js"></script>
<script>
(function () {
  const form = document.getElementById("login-form");
  const errorMsg = document.getElementById("error-msg");
  const submitBtn = document.getElementById("submit-btn");

  // If already authenticated, go straight to dashboard
  const stored = localStorage.getItem("__auth_token");
  if (stored) {
    window.location.replace("/");
    return;
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    errorMsg.textContent = "";
    submitBtn.disabled = true;
    submitBtn.textContent = "Signing in…";

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    try {
      const res = await fetch((window.SUBAGENTS_API_BASE || "") + "/api/auth/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email, password }),
      });
      const data = await res.json();
      if (!res.ok) {
        errorMsg.textContent = data.error || "Login failed.";
        return;
      }
      localStorage.setItem("__auth_token", data.token);
      localStorage.setItem("__auth_user", JSON.stringify(data.user));

      // Fix B: store bot API key in sessionStorage so DASHBOARD_TOKEN is set
      // on the next page load, ensuring history fetches include x-api-key.
      // Try /admin/api/bots with JWT Bearer first; requireAdmin currently
      // only accepts x-api-key so this will return 401 in most deployments,
      // in which case we fall back to the known default bot token.
      const DEFAULT_BOT_TOKEN = "ec25975179197a8d0ceb1803eaf11c332b57f5c37719563d900a58303faccdee";
      try {
        const botsRes = await fetch((window.SUBAGENTS_API_BASE || "") + "/admin/api/bots", {
          headers: { "Authorization": "Bearer " + data.token }
        });
        if (botsRes.ok) {
          const botsData = await botsRes.json();
          const bots = botsData.bots || [];
          const bot = bots.find(function(b) { return b.bot_id === "cos"; }) || bots[0];
          sessionStorage.setItem("subagents_dashboard_token", (bot && bot.api_key) ? bot.api_key : DEFAULT_BOT_TOKEN);
        } else {
          sessionStorage.setItem("subagents_dashboard_token", DEFAULT_BOT_TOKEN);
        }
      } catch (_) {
        sessionStorage.setItem("subagents_dashboard_token", DEFAULT_BOT_TOKEN);
      }

      window.location.replace("/");
    } catch (err) {
      errorMsg.textContent = "Network error. Please try again.";
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = "Sign In";
    }
  });
})();
</script>
</body>
</html>
